<script>
/* ===== CAPA DE DATOS =====
Todo el acceso a datos pasa por Store. Para conectar Supabase o Firebase,
reemplaza load() y save() (mismo formato JSON) sin tocar el resto del código. */
const KEY = 'hogar_v1';
const Store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { alert('No se pudo guardar en este teléfono.'); } }
};
/* ===== NUBE (Supabase) =====
Guarda todos los datos del negocio en una sola fila por usuario, protegida
por Row Level Security: solo el dueño de la cuenta puede leerla o escribirla. */
const SUPABASE_URL = 'https://uukxpwaqrnxdxkclduru.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-iZx14g12WjtAX2OtUerTA_0Jrzmn3w';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let cloudT;
async function cloudPush() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  await sb.from('negocio_data').upsert({ user_id: user.id, data: D, actualizado_en: new Date().toISOString() });
}
async function cloudPull() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const { data, error } = await sb.from('negocio_data').select('data').eq('user_id', user.id).maybeSingle();
  if (error || !data) return null;
  return data.data;
}
const seed = () => ({
  cfg: {nombre: 'Variedades J&T', rnc: '', tel: '', itbis: 18, seq: 1},
  productos: [
    {id: 'p1', nombre: 'Lámpara de Mesa', cat: 'Iluminación', costo: 450, precio: 850, stock: 12, min: 3},
    {id: 'p2', nombre: 'Organizador de Cocina', cat: 'Cocina', costo: 300, precio: 600, stock: 8, min: 4},
    {id: 'p3', nombre: 'Set de Toallas', cat: 'Baño', costo: 380, precio: 700, stock: 5, min: 5}

let D = Object.assign(seed(), Store.load() || {});
D.cfg = Object.assign(seed().cfg, D.cfg);
if (D.cfg.nombre === 'Mi Negocio del Hogar') D.cfg.nombre = 'Variedades J&T';
let syncT;
const save = () => {
  Store.save(D);
  clearTimeout(syncT); if (D.cfg.nubeUrl) syncT = setTimeout(() => nubePush(false), 4000);
  clearTimeout(cloudT); cloudT = setTimeout(cloudPush, 1500);

if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
/* ===== UTILIDADES ===== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const R = n => 'RD$ ' + (+n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

const hoy = () => iso(new Date());
const mes = () => hoy().slice(0, 7);
const sumar = (f, n) => { const d = new Date(f + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const fd = s => (s || '').split('-').reverse().join('/');
const cli = id => D.clientes.find(c => c.id === id);

const fld = (id, l, v, t = 'text') => `<label class="block text-sm font-semibold">${l}<input id="${id}" class="in mt-1 font-normal" type="${t}" ${t === 'number' ? 'inputmode="decimal" step="any" min="0"' : ''} value="${esc(v ?? '')}"></label>`;

  ${v.items.map(i => `<div class="flex justify-between py-0.5"><span>${i.cant} × ${esc(i.nombre)}</span><span>${R(i.cant * i.precio)}</span></div>`).join('')}

const PER = {hoy: ['Hoy', 'de Hoy'], sem: ['7 días', 'de 7 días'], mes: ['Mes', 'del Mes'], anio: ['Año', 'del Año']};
const enPer = f => V.per === 'hoy' ? f === hoy() : V.per === 'sem' ? f >= sumar(hoy(), -6) : V.per === 'mes' ? f.startsWith(mes()) : f.startsWith(hoy().slice(0, 4));
function vInicio() {
  const h = hoy(), ok = D.ventas.filter(v => v.estado !== 'Cancelada'), vs = ok.filter(v => enPer(v.fecha));
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const ven = sum(vs, v => v.sub), cos = sum(vs, v => sum(v.items, i => i.cant * i.costo));
  const gas = sum(D.gastos.filter(x => enPer(x.fecha)), x => x.monto);
  const com = sum(D.compras.filter(c => enPer(c.fecha)), c => c.cant * c.costo);
  const bruta = ven - cos, gan = bruta - gas;

  const mini = (t, v) => `<div class="card"><div class="text-xs text-slate-500">${t}</div><b>${v}</b></div>`;
  const cxHtml = cx.map(v => {
    const c = cli(v.cliente), venc = v.vence < h;
    const wa = c && c.tel ? `<a class="btn2" href="https://wa.me/1${c.tel.replace(/\D/g, '').slice(-10)}?text=${encodeURIComponent('Hola ' + c.nombre + ', le recordamos su pendiente de ' + R(v.total) + ' (' + v.num + ').')}">WhatsApp</a>` : '';
    return `<div class="border-b py-3"><div class="flex justify-between"><b>${esc(c ? c.nombre : 'Cliente')}</b><b>${R(v.total)}</b></div>
<div class="text-sm text-slate-500">${v.num}, vence ${fd(v.vence)} ${venc ? badge('Vencida', 'bg-rose-100 text-rose-700') : ''}</div>
<details class="mt-2"><summary class="btn2 cursor-pointer">Ver factura (qué compró)</summary>${detalle(v)}<button class="btn2 w-full mt-2" data-a="rec" data-i="${v.id}">Imprimir recibo</button></details>
<div class="flex gap-2 mt-2"><button class="btn2 flex-1" data-a="pagar" data-i="${v.id}">Marcar como Pagado</button>${wa}</div></div>`;
  }).join('') || '<p class="text-slate-500">Sin cuentas pendientes 🎉</p>';
  const ph = PER[V.per][1];
  return (vc.length ? `<div class="rounded-xl bg-rose-100 text-rose-800 p-4 font-semibold">⚠️ ${vc.length} ${vc.length > 1 ? 'facturas vencidas' : 'factura vencida'} por ${R(sum(vc, v => v.total))}</div>` : '')
    + `<h2 class="font-bold text-lg">Dashboard Gerencial</h2>`
    + `<div class="grid grid-cols-4 gap-2">${Object.entries(PER).map(([k, [t]]) => `<button class="btn2 ${V.per === k ? '!bg-emerald-600 !text-white' : ''}" data-a="per" data-i="${k}">${t}</button>`).join('')}</div>`
    + big('Ventas ' + ph, ven, 'text-emerald-700') + big('Gastos ' + ph, gas, 'text-rose-600') + big('Ganancia Neta', gan, gan < 0 ? 'text-rose-600' : 'text-blue-900')
    + `<div class="grid grid-cols-2 gap-3">${mini('Ganancia bruta', R(bruta))}${mini('Margen neto', (ven ? Math.round(gan / ven * 100) : 0) + '%')}${mini('Facturas emitidas', vs.length)}${mini('Ticket promedio', R(vs.length ? ven / vs.length : 0))}${mini('Compras de mercancía', R(com))}${mini('Inventario a costo', R(sum(D.productos, p => p.stock * p.costo)))}${mini('Cobrado en efectivo', R(efe))}${mini('Cobrado por transferencia', R(tra))}${mini('Por cobrar total', R(sum(cx, v => v.total)))}${mini('Facturas vencidas', vc.length)}</div>`
    + `<div class="card"><h2 class="font-bold mb-3">Ventas de los últimos 7 días</h2><div class="flex gap-2">${dias.map((d, k) => `<div class="flex-1"><div class="h-28 flex items-end"><div class="w-full bg-emerald-500 rounded-t" style="height:${vd[k] ? Math.max(4, Math.round(vd[k] / mx * 100)) : 0}%"></div></div><div class="text-[10px] text-center text-slate-500 mt-1">${d.slice(8)}</div></div>`).join('')}</div></div>`
    + `<div class="card"><h2 class="font-bold mb-2">Artículos que más ganancia dejan</h2>${top.map(([n, t]) => `<div class="flex justify-between py-1"><span>${esc(n)} <span class="text-xs text-slate-500">x${t.q}</span></span><b class="text-emerald-700">${R(t.g)}</b></div>`).join('') || '<p class="text-slate-500">Aún no hay ventas en este período.</p>'}</div>`
    + `<div class="card"><h2 class="font-bold mb-2">Alertas de Stock</h2>${bajo.map(p => `<div class="flex justify-between py-1"><span>${esc(p.nombre)}</span><b class="text-rose-600">${p.stock}/${p.min}</b></div>`).join('') || '<p class="text-slate-500">Todo el inventario está bien 👍</p>'}</div>`
    + `<div class="card"><h2 class="font-bold">Cuentas por Cobrar</h2>${cxHtml}</div>`;
}
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function resultados() {
  const q = norm(V.bq);
  if (!q && !V.ver) return '';
  const l = D.productos.filter(p => !q || norm(p.nombre + ' ' + p.cat).includes(q)).slice(0, q ? 8 : 30);
  return l.map(p => `<button class="w-full flex justify-between items-center text-left border rounded-xl p-3 bg-white" data-a="addp" data-i="${p.id}"><span><b>${esc(p.nombre)}</b><br><span class="text-xs text-slate-500">Stock ${p.stock}</span></span><b>${R(p.precio)}</b></button>`).join('')
    || '<p class="text-sm text-slate-500">Sin coincidencias. Usa la factura rápida de abajo.</p>';
}
function cartTot() {
  const sub = cart.reduce((s, i) => s + i.cant * i.precio, 0);
  const itbis = V.itbis ? Math.round(sub * D.cfg.itbis) / 100 : 0;
  return {sub, itbis, total: sub + itbis};
}
function vVender() {
  const t = cartTot(), cred = V.estado === 'Por Cobrar';
  const cl = [['', 'Cliente general'], ...D.clientes.map(x => [x.id, x.nombre]), ['__n', '+ Nuevo cliente']];
  return `<div class="card space-y-3"><h2 class="font-bold">Nueva venta</h2>
<input id="bq" class="in" type="search" data-k="bq" placeholder="🔍 Buscar artículo (ej. toalla)" value="${esc(V.bq)}" autocomplete="off">
<label class="flex items-center gap-3 text-sm font-semibold">Cantidad<input class="in !w-24" type="number" min="1" inputmode="numeric" data-k="q" value="${V.q}"></label>
<button class="btn2 w-full" data-a="ver">${V.ver ? '▴ Ocultar artículos' : '▾ Ver artículos'}</button>
<div id="res" class="space-y-2">${resultados()}</div>
<details class="rounded-xl border p-3" ${cart.some(i => i.libre) || V.qn ? 'open' : ''}><summary class="font-semibold">⚡ Factura rápida (sin crear producto)</summary>
<div class="space-y-2 mt-3"><input class="in" data-k="qn" placeholder="Nombre del artículo o servicio" value="${esc(V.qn)}">
<div class="grid grid-cols-3 gap-2"><input class="in" type="number" min="1" inputmode="numeric" data-k="qc" placeholder="Cant." value="${V.qc}"><input class="in" type="number" inputmode="decimal" data-k="qp" placeholder="Precio" value="${esc(V.qp)}"><input class="in" type="number" inputmode="decimal" data-k="qk" placeholder="Costo (opc.)" value="${esc(V.qk)}"></div>
<button class="btn2 w-full" data-a="addq">Agregar a la factura</button></div></details>
    ${cart.map((i, n) => `<div class="flex justify-between items-center border-b py-2"><span>${i.cant} × ${esc(i.nombre)}</span><span>${R(i.cant * i.precio)} <button data-a="rm" data-i="${n}" class="text-rose-600 px-2">✕</button></span></div>`).join('')}
    ${sel('cliente', cl, V.cliente)}
    ${V.cliente === '__n' ? `<input class="in" data-k="nom" placeholder="Nombre del cliente" value="${esc(V.nom)}"><input class="in" type="tel" data-k="tel" placeholder="Teléfono / WhatsApp" value="${esc(V.tel)}">` : ''}
    ${sel('estado', [['Pagado', 'Pagado'], ['Por Cobrar', 'Por Cobrar']], V.estado)}
    ${cred ? sel('dias', [[8, 'Vence en 8 días'], [15, 'Vence en 15 días'], [30, 'Vence en 30 días']], V.dias) : ''}
    ${sel('metodo', [['Efectivo', 'Efectivo'], ['Transferencia', 'Transferencia']], V.metodo)}
<label class="flex gap-2 items-center"><input type="checkbox" data-k="itbis" data-r ${V.itbis ? 'checked' : ''}> Aplicar ITBIS (${D.cfg.itbis}%)</label>
<div class="flex justify-between font-bold text-lg"><span>Total</span><span>${R(t.total)}</span></div>
<button class="btn" data-a="vender">Registrar Venta</button></div>`;
}
function vInv() {
  const f = form;
  return `<button class="btn" data-a="nuevoP">+ Agregar Producto</button>`
    + (f ? `<div class="card space-y-3"><h2 class="font-bold">${f.id ? 'Editar' : 'Nuevo'} producto</h2>
      ${fld('f-n', 'Nombre', f.nombre)}${fld('f-c', 'Categoría', f.cat)}${fld('f-co', 'Costo de compra (RD$)', f.costo, 'number')}${fld('f-pr', 'Precio de venta (RD$)', f.precio, 'number')}${f.id ? '' : fld('f-s', 'Stock inicial', f.stock, 'number')}${fld('f-m', 'Stock mínimo', f.min, 'number')}

function vGas() {

const vMas = () => ['clientes|👥 Clientes', 'ventas|🧾 Historial de ventas', 'ajustes|⚙️ Ajustes y respaldo']
  .map(s => { const [k, t] = s.split('|'); return `<button class="card w-full text-left text-lg font-semibold" data-a="go" data-i="${k}">${t}</button>`; }).join('');

    }).join('');

function vVen() {
  return D.ventas.slice(0, 40).map(v => {
    const c = cli(v.cliente), venc = v.estado === 'Por Cobrar' && v.vence < hoy();
    return `<div class="card ${v.estado === 'Cancelada' ? 'opacity-70' : ''}"><div class="flex justify-between"><b>${v.num}</b><b class="${v.estado === 'Cancelada' ? 'line-through text-slate-400' : ''}">${R(v.total)}</b></div>
<div class="text-sm text-slate-500">${fd(v.fecha)}, ${esc(c ? c.nombre : 'Cliente general')}, ${v.metodo}</div>
<div class="mt-1">${v.estado === 'Cancelada' ? badge('CANCELADA', 'bg-rose-600 text-white font-bold') : badge(v.estado, v.estado === 'Pagado' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700')} ${venc ? badge('Vencida', 'bg-rose-100 text-rose-700') : ''}</div>
<details class="mt-2"><summary class="text-emerald-700 font-semibold cursor-pointer">Ver detalle</summary>${detalle(v)}</details>
<div class="flex gap-2 mt-3"><button class="btn2 flex-1" data-a="rec" data-i="${v.id}">Recibo</button>${v.estado === 'Cancelada' ? '' : `<button class="btn2 text-rose-600" data-a="anular" data-i="${v.id}">Cancelar factura</button>`}</div></div>`;
  }).join('') || '<p class="text-slate-500">Aún no hay ventas.</p>';
}
function vAj() {
  const c = D.cfg;
  return `<div class="card space-y-3"><h2 class="font-bold">Mi negocio</h2>${fld('a-n', 'Nombre', c.nombre)}${fld('a-r', 'RNC', c.rnc)}${fld('a-t', 'Teléfono', c.tel)}${fld('a-i', 'ITBIS (%)', c.itbis, 'number')}${fld('a-u', 'Enlace de la nube (Google)', c.nubeUrl || '')}${fld('a-k', 'Clave secreta de la nube', c.nubeClave || '')}<button class="btn" data-a="saveCfg">Guardar</button></div>
<div class="card space-y-3"><h2 class="font-bold">Respaldo de datos</h2><p class="text-sm text-slate-500">Tus datos viven en este teléfono. Envíate el respaldo a tu correo o WhatsApp con frecuencia.</p>
<button class="btn" data-a="sync">Enviar ahora a mi hoja de Google y correo</button><p class="text-xs text-slate-500">${c.nubeUlt ? 'Última copia en la nube: ' + esc(c.nubeUlt) : 'Aún no has enviado copia a la nube.'}</p><button class="btn2 w-full" data-a="nube">Restaurar desde la nube</button><button class="btn2 w-full" data-a="bk">Compartir respaldo (WhatsApp…)</button><button class="btn2 w-full" data-a="dl">Descargar respaldo</button><button class="btn2 w-full" data-a="rs">Restaurar respaldo</button>
<input id="rf" type="file" accept=".json,application/json" hidden></div>
<button class="btn2 w-full text-rose-600" data-a="logout">Cerrar sesión</button>`;
}
function render() {
  $('#tt').textContent = D.cfg.nombre;
  const vs = {inicio: vInicio, vender: vVender, inventario: vInv, gastos: vGas, mas: vMas, clientes: vCli, ventas: vVen, ajustes: vAj};
  const back = ['clientes', 'ventas', 'ajustes'].includes(tab) ? '<button class="text-emerald-700 font-semibold" data-a="go" data-i="mas">← Volver</button>' : '';
  $('#v').innerHTML = back + vs[tab]();
  $('#nav').innerHTML = TABS.map(([k, e, t]) => `<button data-a="go" data-i="${k}" class="py-2 ${tab === k ? 'text-emerald-700 font-bold' : 'text-slate-500'}"><div class="text-xl">${e}</div><div class="text-xs">${t}</div></button>`).join('');
}
/* ===== ACCIONES ===== */
const g = id => $('#' + id).value;
function compra(p, cant, costo) { D.compras.push({id: uid(), fecha: hoy(), pid: p.id, nombre: p.nombre, cant, costo}); }
function vender() {
  if (!cart.length) return toast('Agrega al menos un artículo');
  for (const i of cart) { if (i.libre) continue; const p = D.productos.find(x => x.id === i.id); if (!p || p.stock < i.cant) return toast('Stock insuficiente de ' + i.nombre); }
  let cid = V.cliente;
  if (cid === '__n') {
    if (!V.nom.trim()) return toast('Escribe el nombre del cliente');
    const n = {id: uid(), nombre: V.nom.trim(), tel: V.tel.trim()};
    D.clientes.push(n); cid = n.id;
  }
  if (V.estado === 'Por Cobrar' && !cid) return toast('Elige o crea el cliente para vender a crédito');
  cart.forEach(i => { if (!i.libre) D.productos.find(x => x.id === i.id).stock -= i.cant; });
  const num = 'F-' + String(D.cfg.seq++).padStart(4, '0');
  const v = {id: uid(), num, fecha: hoy(), cliente: cid || null, items: cart, ...cartTot(), estado: V.estado, metodo: V.metodo, vence: V.estado === 'Por Cobrar' ? sumar(hoy(), +V.dias) : null};
  D.ventas.unshift(v); save();
  cart = []; V.cliente = ''; V.nom = ''; V.tel = ''; V.itbis = false;
  render(); toast('Venta ' + num + ' registrada');
  if (confirm('¿Imprimir el recibo?')) imprimir(v.id);
}
function imprimir(id) {
  const v = D.ventas.find(x => x.id === id), c = cli(v.cliente), W = 32, L = '-'.repeat(W);
  const cen = t => ' '.repeat(Math.max(0, (W - t.length) >> 1)) + t;
  const lin = (a, b) => a + ' '.repeat(Math.max(1, W - a.length - b.length)) + b;
  const f2 = n => (+n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const t = [cen(D.cfg.nombre.slice(0, W)), D.cfg.rnc && cen('RNC ' + D.cfg.rnc), D.cfg.tel && cen('Tel ' + D.cfg.tel), L,
    lin(v.num, fd(v.fecha)), 'Cliente: ' + (c ? c.nombre : 'General'), L,
...v.items.flatMap(i => [...(i.nombre.match(/.{1,32}/g) || [i.nombre]), lin(' ' + i.cant + ' x ' + f2(i.precio), f2(i.cant * i.precio))]), L,
    lin('Subtotal', f2(v.sub)), v.itbis && lin('ITBIS', f2(v.itbis)), lin('TOTAL', f2(v.total)), L,
    v.estado === 'Cancelada' ? cen('*** CANCELADA ***') : v.estado === 'Pagado' ? 'Pagado (' + v.metodo + ')' : 'A CREDITO, vence ' + fd(v.vence),
    cen('Gracias por su compra'), cen('Recibo no fiscal')].filter(Boolean);
  $('#rec').textContent = t.join('\n') + '\n\n\n\n';
  setTimeout(() => window.print(), 50);
}
function nubePush(manual) {
  const c = D.cfg;
  if (!c.nubeUrl) { if (manual) toast('Primero pega el enlace de la nube en Ajustes'); return; }
  fetch(c.nubeUrl, {method: 'POST', mode: 'no-cors', body: JSON.stringify({clave: c.nubeClave, correo: !!manual, data: D})})
    .then(() => { c.nubeUlt = new Date().toLocaleString('es-DO'); Store.save(D); if (manual) { toast('Copia enviada. Revisa tu hoja y tu correo'); if (tab === 'ajustes') render(); } })
    .catch(() => { if (manual) toast('Sin conexión. Intenta de nuevo'); });
}
async function nubePull() {
  const c = D.cfg;
  if (!c.nubeUrl) return toast('Primero pega el enlace de la nube en Ajustes');
  try {
    const r = await fetch(c.nubeUrl + '?clave=' + encodeURIComponent(c.nubeClave)), d = await r.json();
    if (!d.productos) throw 0;
    if (!confirm('Esto reemplaza los datos de este teléfono con los de tu hoja. ¿Continuar?')) return;
    const u = c.nubeUrl, k = c.nubeClave;
    D = Object.assign(seed(), d); D.cfg = Object.assign(seed().cfg, D.cfg, {nubeUrl: u, nubeClave: k});
    Store.save(D); render(); toast('Datos restaurados desde la nube');
  } catch (e) { toast('No se pudo leer la copia. Revisa el enlace y la clave'); }
}
async function respaldo(compartir) {
  const f = new File([JSON.stringify(D, null, 2)], 'respaldo-' + hoy() + '.json', {type: 'application/json'});
  if (compartir && navigator.canShare && navigator.canShare({files: [f]})) { try { await navigator.share({files: [f], title: 'Respaldo ' + D.cfg.nombre}); } catch (e) {} return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
}
function restaurar(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.productos || !d.cfg) throw 0;
      if (!confirm('Esto reemplaza los datos actuales. ¿Continuar?')) return;
      D = Object.assign(seed(), d); save(); render(); toast('Respaldo restaurado');
    } catch (e) { toast('Archivo de respaldo no válido'); }
  };
  r.readAsText(file);
}
const A = {
  go: i => { tab = i; form = null; scrollTo(0, 0); render(); },
  addp: id => {
    const p = D.productos.find(x => x.id === id), q = parseInt(V.q) || 0;
    if (!p || q < 1) return toast('Escribe una cantidad válida');
    const ya = cart.filter(i => i.id === p.id).reduce((s, i) => s + i.cant, 0);
    if (ya + q > p.stock) return toast('Stock insuficiente: quedan ' + (p.stock - ya));
    const e = cart.find(i => i.id === p.id);
    if (e) e.cant += q; else cart.push({id: p.id, nombre: p.nombre, cant: q, precio: p.precio, costo: p.costo});
    V.bq = ''; V.q = 1; V.ver = false; render(); $('#bq').focus();
  },
  addq: () => {
    const n = V.qn.trim(), c = parseInt(V.qc) || 0, pr = parseFloat(V.qp) || 0;
    if (!n || c < 1 || pr <= 0) return toast('Escribe nombre, cantidad y precio');
    cart.push({id: null, libre: true, nombre: n, cant: c, precio: pr, costo: parseFloat(V.qk) || 0});
    V.qn = ''; V.qc = 1; V.qp = ''; V.qk = ''; render();
  },
  ver: () => { V.ver = !V.ver; render(); },
  per: i => { V.per = i; render(); },
  rm: i => { cart.splice(+i, 1); render(); },
vender,
  pagar: id => { const v = D.ventas.find(x => x.id === id); v.estado = 'Pagado'; v.pagadoEl = hoy(); save(); render(); toast('Cobro registrado'); },
  nuevoP: () => { form = {nombre: '', cat: '', costo: '', precio: '', stock: '', min: 2}; render(); },
  editP: id => { form = {...D.productos.find(x => x.id === id)}; render(); },
  cancel: () => { form = null; render(); },
  saveP: () => {
    const p = {nombre: g('f-n').trim(), cat: g('f-c').trim(), costo: +g('f-co') || 0, precio: +g('f-pr') || 0, min: +g('f-m') || 0};
    if (!p.nombre || !p.precio) return toast('Nombre y precio son obligatorios');
    if (form.id) Object.assign(D.productos.find(x => x.id === form.id), p);
    else { p.id = uid(); p.stock = +g('f-s') || 0; D.productos.push(p); if (p.stock) compra(p, p.stock, p.costo); }
    form = null; save(); render();
  },
  mas1: id => { const p = D.productos.find(x => x.id === id); p.stock++; compra(p, 1, p.costo); save(); render(); },
  recibir: id => {
    const p = D.productos.find(x => x.id === id);
    const q = parseInt(prompt('¿Cuántas unidades llegaron?', '1'));
    if (!(q > 0)) return;
    const c = parseFloat(prompt('Costo por unidad (RD$)', p.costo));
    if (!(c >= 0)) return;
    p.stock += q; p.costo = c; compra(p, q, c); save(); render();
  },
  delP: id => { if (confirm('¿Borrar este producto?')) { D.productos = D.productos.filter(x => x.id !== id); save(); render(); } },
  addG: () => {
    const c = g('g-c').trim(), m = +g('g-m');
    if (!c || !(m > 0)) return toast('Escribe concepto y monto');
    D.gastos.push({id: uid(), fecha: hoy(), concepto: c, monto: m}); save(); render();
  },
  delG: id => { D.gastos = D.gastos.filter(x => x.id !== id); save(); render(); },
  addC: () => {
    const n = g('c-n').trim(); if (!n) return toast('Escribe el nombre');
    D.clientes.push({id: uid(), nombre: n, tel: g('c-t').trim()}); save(); render();
  },
  rec: imprimir,
  anular: id => {
    const v = D.ventas.find(x => x.id === id);
    if (v.estado === 'Cancelada' || !confirm('¿Cancelar la factura ' + v.num + '? Se devuelve el stock y queda marcada como CANCELADA.')) return;
    v.items.forEach(i => { const p = D.productos.find(x => x.id === i.id); if (p) p.stock += i.cant; });
    v.estado = 'Cancelada'; v.canceladaEl = hoy(); save(); render(); toast('Factura ' + v.num + ' cancelada');
  },
  saveCfg: () => {
    D.cfg.nombre = g('a-n').trim() || 'Mi Negocio'; D.cfg.rnc = g('a-r').trim(); D.cfg.tel = g('a-t').trim(); D.cfg.itbis = +g('a-i') || 0; D.cfg.nubeUrl = g('a-u').trim(); D.cfg.nubeClave = g('a-k').trim();
    save(); render(); toast('Ajustes guardados');
  },
  sync: () => nubePush(true),
  nube: nubePull,
  bk: () => respaldo(true),
  dl: () => respaldo(false),
  rs: () => $('#rf').click(),
  logout: async () => { if (!confirm('¿Cerrar sesión?')) return; await sb.auth.signOut(); location.reload(); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset.i, b); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset.k) V[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.k === 'bq') $('#res').innerHTML = resultados(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.k) { V[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; if (t.hasAttribute('data-r')) render(); }
  if (t.id === 'rf') restaurar(t.files[0]);
});
/* ===== AUTENTICACIÓN Y ARRANQUE ===== */
function authMsg(m) { $('#au-msg').textContent = m; }
async function iniciarSesionApp() {
  $('#auth').style.display = 'none';
  const cloud = await cloudPull();
  if (cloud) {
    D = Object.assign(seed(), cloud);
    D.cfg = Object.assign(seed().cfg, D.cfg);
    Store.save(D);
  } else {
    await cloudPush();
  }
  render();
}
$('#au-in').addEventListener('click', async () => {
  const email = g('au-e').trim(), pass = g('au-p');
  if (!email || !pass) return authMsg('Escribe tu correo y contraseña');
  authMsg('Entrando…');
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) authMsg('Correo o contraseña incorrectos');
});
$('#au-up').addEventListener('click', async () => {
  const email = g('au-e').trim(), pass = g('au-p');
  if (!email || !pass) return authMsg('Escribe tu correo y contraseña');
  if (pass.length < 6) return authMsg('La contraseña debe tener al menos 6 caracteres');
  authMsg('Creando cuenta…');
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if (error) return authMsg(error.message.includes('already') ? 'Ese correo ya tiene cuenta, usa Entrar' : 'No se pudo crear la cuenta');
  if (data.session) return; // onAuthStateChange se encarga
  authMsg('Cuenta creada. Revisa tu correo para confirmar y luego entra.');
});
sb.auth.onAuthStateChange((event, session) => {
  if (session) iniciarSesionApp();
  else { $('#auth').style.display = 'flex'; authMsg(''); }
});
</script>
