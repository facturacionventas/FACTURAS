<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#065f46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{-webkit-tap-highlight-color:transparent}
.in{width:100%;border:1px solid #d1d5db;border-radius:.75rem;padding:.8rem;font-size:1rem;background:#fff}
.btn{display:block;width:100%;padding:.9rem;border-radius:.75rem;font-weight:700;background:#059669;color:#fff}
.btn2{padding:.6rem .8rem;border-radius:.6rem;font-weight:600;background:#e5e7eb;font-size:.9rem;text-align:center}
.card{background:#fff;border-radius:1rem;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.06)}
#rec,#fac{display:none}
#rec{white-space:pre}
#fac{color:#000;background:#fff;font:13px/1.45 Arial,Helvetica,sans-serif}
#fac .fh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:12px}
#fac h1{font-size:22px;margin:0 0 4px}
#fac h2{font-size:20px;margin:0 0 4px;letter-spacing:2px}
#fac .fr{text-align:right}
#fac .fc{margin:0 0 12px;font-size:14px}
#fac table{width:100%;border-collapse:collapse}
#fac .ft th{border-bottom:1.5px solid #000;padding:6px 4px;text-align:left;font-size:12px;text-transform:uppercase}
#fac .ft td{border-bottom:1px solid #bbb;padding:6px 4px;vertical-align:top}
#fac tr{page-break-inside:avoid}
#fac .r,#fac .ft th.r{text-align:right}
#fac .fs{width:45%;margin:12px 0 0 auto}
#fac .fs td{padding:3px 4px}
#fac .fs .tot td{border-top:2px solid #000;font-weight:700;font-size:16px;padding-top:6px}
#fac .fe{margin-top:16px;font-weight:700}
#fac .fx{margin:10px 0;font-size:28px;font-weight:700;letter-spacing:4px;text-align:center;border:3px solid #000;padding:6px}
#fac .fp{margin-top:28px;text-align:center;font-size:12px}
@media print{
  body>*:not(#rec):not(#fac){display:none!important}
  body{padding:0!important;background:#fff!important}
  body.pt #fac,body.pc #rec{display:none!important}
  body.pt #rec{display:block;width:48mm;padding:2mm;box-sizing:content-box;font:9px/1.3 monospace;color:#000}
  body.pc #fac{display:block;padding:14mm}
}
</style>
<style id="pg"></style>
</head>
<body class="bg-slate-100 text-slate-800 pb-24">
<div id="auth" class="fixed inset-0 bg-emerald-800 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-3">
    <h1 class="font-bold text-xl text-center text-emerald-800">Variedades J&amp;T</h1>
    <p class="text-sm text-slate-500 text-center">Entra con tu correo para acceder a tus datos desde cualquier dispositivo.</p>
    <input id="au-e" class="in" type="email" placeholder="Correo" autocomplete="username">
    <input id="au-p" class="in" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="au-in" class="btn">Entrar</button>
    <button id="au-up" class="btn2 w-full">Crear cuenta nueva</button>
    <button id="au-fp" class="text-sm text-emerald-700 underline w-full text-center">¿Olvidaste tu contraseña?</button>
    <p id="au-msg" class="text-sm text-center min-h-[1.25rem]"></p>
  </div>
</div>
<header class="sticky top-0 z-10 bg-emerald-800 text-white px-4 py-3 flex justify-between items-center">
  <div class="min-w-0"><h1 id="tt" class="font-bold truncate cursor-pointer" data-a="go" data-i="inicio" role="button" title="Ir al Inicio"></h1><div id="sy" class="text-[11px] text-emerald-200"></div></div>
  <button data-a="go" data-i="mas" class="text-2xl px-2" aria-label="Más opciones">☰</button>
</header>
<main id="v" class="p-4 space-y-4 max-w-xl mx-auto"></main>
<nav id="nav" class="fixed bottom-0 inset-x-0 bg-white border-t grid grid-cols-5 pb-[env(safe-area-inset-bottom)]"></nav>
<div id="ts" class="fixed left-1/2 -translate-x-1/2 bottom-24 bg-slate-900 text-white px-4 py-2 rounded-xl opacity-0 transition-opacity pointer-events-none z-20"></div>
<div id="mdl" class="fixed inset-0 bg-black/50 items-center justify-center p-4 z-40" style="display:none"></div>
<div id="rec"></div>
<div id="fac"></div>
<script>
/* ===== CAPA DE DATOS =====
Todo el acceso a datos pasa por Store. Para conectar Supabase o Firebase,
reemplaza load() y save() (mismo formato JSON) sin tocar el resto del código. */
const KEY = 'hogar_v1';
const Store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { alert('No se pudo guardar en este teléfono.'); } }
};
/* ===== NUBE (Supabase) =====
Guarda todos los datos del negocio en una sola fila por usuario, protegida
por Row Level Security: solo el dueño de la cuenta puede leerla o escribirla. */
const SUPABASE_URL = 'https://uukxpwaqrnxdxkclduru.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-iZx14g12WjtAX2OtUerTA_0Jrzmn3w';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let cloudT, dirty = false;
function syncEstado(t) { const s = $('#sy'); if (s) s.textContent = t; }
async function cloudPush() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  syncEstado('Guardando…');
  const { error } = await sb.from('negocio_data').upsert({ user_id: user.id, data: D, actualizado_en: new Date().toISOString() });
  if (error) { dirty = true; syncEstado('⚠ Sin conexión, pendiente de guardar'); }
  else { dirty = false; syncEstado('Sincronizado ✓'); }
}
async function cloudPull() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const { data, error } = await sb.from('negocio_data').select('data').eq('user_id', user.id).maybeSingle();
  if (error || !data) return null;
  return data.data;
}
window.addEventListener('online', () => { if (dirty) cloudPush(); });
window.addEventListener('offline', () => syncEstado('⚠ Sin conexión'));
const seed = () => ({
  cfg: {nombre: 'Variedades J&T', rnc: '', tel: '', itbis: 18, seq: 1, rseq: 1, formato: 'ticket'},
  productos: [
    {id: 'p1', nombre: 'Lámpara de Mesa', cat: 'Iluminación', costo: 450, precio: 850, stock: 12, min: 3},
    {id: 'p2', nombre: 'Organizador de Cocina', cat: 'Cocina', costo: 300, precio: 600, stock: 8, min: 4},
    {id: 'p3', nombre: 'Set de Toallas', cat: 'Baño', costo: 380, precio: 700, stock: 5, min: 5}
  ],
  clientes: [], ventas: [], gastos: [], compras: [], pagos: []
});
let D = Object.assign(seed(), Store.load() || {});
D.cfg = Object.assign(seed().cfg, D.cfg);
if (D.cfg.nombre === 'Mi Negocio del Hogar') D.cfg.nombre = 'Variedades J&T';
let syncT;
const save = () => {
  Store.save(D);
  syncEstado('Pendiente de guardar…');
  clearTimeout(syncT); if (D.cfg.nubeUrl) syncT = setTimeout(() => nubePush(false), 4000);
  clearTimeout(cloudT); cloudT = setTimeout(cloudPush, 1500);
};
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
/* ===== UTILIDADES ===== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const R = n => 'RD$ ' + (+n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoy = () => iso(new Date());
const mes = () => hoy().slice(0, 7);
const sumar = (f, n) => { const d = new Date(f + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const fd = s => (s || '').split('-').reverse().join('/');
const cli = id => D.clientes.find(c => c.id === id);
const badge = (t, c) => `<span class="text-xs px-2 py-1 rounded-full ${c}">${t}</span>`;
let tm;
function toast(m) { const t = $('#ts'); t.textContent = m; t.style.opacity = 1; clearTimeout(tm); tm = setTimeout(() => t.style.opacity = 0, 2500); }
const sel = (k, opts, cur) => `<select class="in" data-k="${k}" data-r>${opts.map(([v, t]) => `<option value="${esc(v)}" ${v == cur ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
const fld = (id, l, v, t = 'text') => `<label class="block text-sm font-semibold">${l}<input id="${id}" class="in mt-1 font-normal" type="${t}" ${t === 'number' ? 'inputmode="decimal" step="any" min="0"' : ''} value="${esc(v ?? '')}"></label>`;
/* ===== ESTADO DE LA INTERFAZ ===== */
const TABS = [['inicio', '🏠', 'Inicio'], ['vender', '🛒', 'Vender'], ['clientes', '👥', 'Clientes'], ['inventario', '📦', 'Inventario'], ['gastos', '💸', 'Gastos']];
let tab = 'inicio', cart = [], form = null;
let V = {per: 'mes', ver: false, bq: '', qn: '', qc: 1, qp: '', qk: '', q: 1, cliente: '', estado: 'Pagado', dias: 15, metodo: 'Efectivo', imp: '', itbis: false, nom: '', tel: '', vq: '', cq: '', pq: ''};
/* ===== VISTAS ===== */
const detalle = v => `<div class="mt-2 rounded-xl bg-slate-50 p-3 text-sm">
<div class="text-xs text-slate-500 mb-1">${v.num}, ${fd(v.fecha)}</div>
  ${v.items.map(i => `<div class="flex justify-between py-0.5"><span>${i.cant} × ${esc(i.nombre)}</span><span>${R(i.cant * i.precio)}</span></div>`).join('')}
  ${v.itbis ? `<div class="flex justify-between text-slate-500"><span>ITBIS</span><span>${R(v.itbis)}</span></div>` : ''}
<div class="flex justify-between font-bold border-t mt-1 pt-1"><span>Total</span><span>${R(v.total)}</span></div></div>`;
const PER = {hoy: ['Hoy', 'de Hoy'], sem: ['7 días', 'de 7 días'], mes: ['Mes', 'del Mes'], anio: ['Año', 'del Año']};
const enPer = f => V.per === 'hoy' ? f === hoy() : V.per === 'sem' ? f >= sumar(hoy(), -6) : V.per === 'mes' ? f.startsWith(mes()) : f.startsWith(hoy().slice(0, 4));
function vInicio() {
  const h = hoy(), ok = D.ventas.filter(v => v.estado !== 'Cancelada'), vs = ok.filter(v => enPer(v.fecha));
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const ven = sum(vs, v => v.sub), cos = sum(vs, v => sum(v.items, i => i.cant * i.costo));
  const gas = sum(D.gastos.filter(x => enPer(x.fecha)), x => x.monto);
  const com = sum(D.compras.filter(c => enPer(c.fecha)), c => c.cant * c.costo);
  const bruta = ven - cos, gan = bruta - gas;
  const cx = ok.filter(v => v.estado === 'Por Cobrar').sort((a, b) => a.vence.localeCompare(b.vence));
  const vc = cx.filter(v => v.vence < h), bajo = D.productos.filter(p => p.min > 0 && p.stock <= p.min);
  const pag = vs.filter(v => v.estado === 'Pagado');
  const efe = sum(pag.filter(v => v.metodo === 'Efectivo'), v => v.total), tra = sum(pag.filter(v => v.metodo === 'Transferencia'), v => v.total), tar = sum(pag.filter(v => v.metodo === 'Tarjeta'), v => v.total);
  const dias = [...Array(7)].map((_, k) => sumar(h, k - 6));
  const vd = dias.map(d => sum(ok.filter(v => v.fecha === d), v => v.sub)), mx = Math.max(...vd, 1);
  const tp = {};
  vs.forEach(v => v.items.forEach(i => { const t = tp[i.nombre] || (tp[i.nombre] = {q: 0, g: 0}); t.q += i.cant; t.g += i.cant * (i.precio - i.costo); }));
  const top = Object.entries(tp).sort((a, b) => b[1].g - a[1].g).slice(0, 5);
  const big = (t, v, c) => `<div class="card"><div class="text-sm text-slate-500">${t}</div><div class="text-3xl font-extrabold ${c}">${R(v)}</div></div>`;
  const mini = (t, v) => `<div class="card"><div class="text-xs text-slate-500">${t}</div><b>${v}</b></div>`;
  const cxHtml = cx.map(v => {
    const c = cli(v.cliente), venc = v.vence < h;
    const wa = c && c.tel ? `<a class="btn2" href="https://wa.me/1${c.tel.replace(/\D/g, '').slice(-10)}?text=${encodeURIComponent('Hola ' + c.nombre + ', le recordamos su pendiente de ' + R(v.total) + ' (' + v.num + ').')}">WhatsApp</a>` : '';
    return `<div class="border-b py-3"><div class="flex justify-between"><b>${esc(c ? c.nombre : 'Cliente')}</b><b>${R(v.total)}</b></div>
<div class="text-sm text-slate-500">${v.num}, vence ${fd(v.vence)} ${venc ? badge('Vencida', 'bg-rose-100 text-rose-700') : ''}</div>
<details class="mt-2"><summary class="btn2 cursor-pointer">Ver factura (qué compró)</summary>${detalle(v)}<div class="flex gap-2 mt-2"><button class="btn2 flex-1" data-a="recT" data-i="${v.id}">Ticket 58 mm</button><button class="btn2 flex-1" data-a="recC" data-i="${v.id}">Factura carta</button></div></details>
<div class="flex gap-2 mt-2"><button class="btn2 flex-1" data-a="pagar" data-i="${v.id}">Marcar como Pagado</button>${wa}</div></div>`;
  }).join('') || '<p class="text-slate-500">Sin cuentas pendientes 🎉</p>';
  const ph = PER[V.per][1];
  return (vc.length ? `<div class="rounded-xl bg-rose-100 text-rose-800 p-4 font-semibold">⚠️ ${vc.length} ${vc.length > 1 ? 'facturas vencidas' : 'factura vencida'} por ${R(sum(vc, v => v.total))}</div>` : '')
    + `<h2 class="font-bold text-lg">Dashboard Gerencial</h2>`
    + `<div class="grid grid-cols-4 gap-2">${Object.entries(PER).map(([k, [t]]) => `<button class="btn2 ${V.per === k ? '!bg-emerald-600 !text-white' : ''}" data-a="per" data-i="${k}">${t}</button>`).join('')}</div>`
    + big('Ventas ' + ph, ven, 'text-emerald-700') + big('Gastos ' + ph, gas, 'text-rose-600') + big('Ganancia Neta', gan, gan < 0 ? 'text-rose-600' : 'text-blue-900')
    + `<div class="grid grid-cols-2 gap-3">${mini('Ganancia bruta', R(bruta))}${mini('Margen neto', (ven ? Math.round(gan / ven * 100) : 0) + '%')}${mini('Facturas emitidas', vs.length)}${mini('Ticket promedio', R(vs.length ? ven / vs.length : 0))}${mini('Compras de mercancía', R(com))}${mini('Inventario a costo', R(sum(D.productos, p => p.stock * p.costo)))}${mini('Cobrado en efectivo', R(efe))}${mini('Cobrado por transferencia', R(tra))}${mini('Cobrado con tarjeta', R(tar))}${mini('Por cobrar total', R(sum(cx, v => v.total)))}${mini('Facturas vencidas', vc.length)}</div>`
    + `<div class="card"><h2 class="font-bold mb-3">Ventas de los últimos 7 días</h2><div class="flex gap-2">${dias.map((d, k) => `<div class="flex-1"><div class="h-28 flex items-end"><div class="w-full bg-emerald-500 rounded-t" style="height:${vd[k] ? Math.max(4, Math.round(vd[k] / mx * 100)) : 0}%"></div></div><div class="text-[10px] text-center text-slate-500 mt-1">${d.slice(8)}</div></div>`).join('')}</div></div>`
    + `<div class="card"><h2 class="font-bold mb-2">Artículos que más ganancia dejan</h2>${top.map(([n, t]) => `<div class="flex justify-between py-1"><span>${esc(n)} <span class="text-xs text-slate-500">x${t.q}</span></span><b class="text-emerald-700">${R(t.g)}</b></div>`).join('') || '<p class="text-slate-500">Aún no hay ventas en este período.</p>'}</div>`
    + `<div class="card"><h2 class="font-bold mb-2">Alertas de Stock</h2>${bajo.map(p => `<div class="flex justify-between py-1"><span>${esc(p.nombre)}</span><b class="text-rose-600">${p.stock}/${p.min}</b></div>`).join('') || '<p class="text-slate-500">Todo el inventario está bien 👍</p>'}</div>`
    + `<div class="card"><h2 class="font-bold">Cuentas por Cobrar</h2>${cxHtml}</div>`;
}
const fmt = () => V.imp || D.cfg.formato || 'ticket';
const nk = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function resultados() {
  const q = norm(V.bq);
  if (!q && !V.ver) return '';
  const l = D.productos.filter(p => !q || norm(p.nombre + ' ' + p.cat).includes(q)).slice(0, q ? 8 : 30);
  return l.map(p => `<button class="w-full flex justify-between items-center text-left border rounded-xl p-3 bg-white" data-a="addp" data-i="${p.id}"><span><b>${esc(p.nombre)}</b><br><span class="text-xs text-slate-500">Stock ${p.stock}</span></span><b>${R(p.precio)}</b></button>`).join('')
    || '<p class="text-sm text-slate-500">Sin coincidencias. Usa la factura rápida de abajo.</p>';
}
function cartTot() {
  const sub = cart.reduce((s, i) => s + i.cant * i.precio, 0);
  const itbis = V.itbis ? Math.round(sub * D.cfg.itbis) / 100 : 0;
  return {sub, itbis, total: sub + itbis};
}
function vVender() {
  const t = cartTot(), cred = V.estado === 'Por Cobrar';
  const cl = [['', 'Cliente general'], ...D.clientes.map(x => [x.id, x.nombre]), ['__n', '+ Nuevo cliente']];
  return `<div class="card space-y-3"><h2 class="font-bold">Nueva venta</h2>
<input id="bq" class="in" type="search" data-k="bq" placeholder="🔍 Buscar artículo (ej. toalla)" value="${esc(V.bq)}" autocomplete="off">
<label class="flex items-center gap-3 text-sm font-semibold">Cantidad<input class="in !w-24" type="number" min="1" inputmode="numeric" data-k="q" value="${V.q}"></label>
<button class="btn2 w-full" data-a="ver">${V.ver ? '▴ Ocultar artículos' : '▾ Ver artículos'}</button>
<div id="res" class="space-y-2">${resultados()}</div>
<details class="rounded-xl border p-3" ${cart.some(i => i.libre) || V.qn ? 'open' : ''}><summary class="font-semibold">⚡ Factura rápida (se guarda en Inventario)</summary>
<div class="space-y-2 mt-3"><input class="in" data-k="qn" placeholder="Nombre del artículo o servicio" value="${esc(V.qn)}">
<div class="grid grid-cols-3 gap-2"><input class="in" type="number" min="1" inputmode="numeric" data-k="qc" placeholder="Cant." value="${V.qc}"><input class="in" type="number" inputmode="decimal" data-k="qp" placeholder="Precio" value="${esc(V.qp)}"><input class="in" type="number" inputmode="decimal" data-k="qk" placeholder="Costo (opc.)" value="${esc(V.qk)}"></div>
<button class="btn2 w-full" data-a="addq">Agregar a la factura</button>
<p class="text-xs text-slate-500">Si el artículo no existe, se crea en Inventario con existencia 0. Si ya existe, se usa el mismo.</p></div></details>
    ${cart.map((i, n) => `<div class="flex justify-between items-center border-b py-2"><span>${i.cant} × ${esc(i.nombre)}</span><span>${R(i.cant * i.precio)} <button data-a="rm" data-i="${n}" class="text-rose-600 px-2">✕</button></span></div>`).join('')}
    ${sel('cliente', cl, V.cliente)}
    ${V.cliente === '__n' ? `<input class="in" data-k="nom" placeholder="Nombre del cliente" value="${esc(V.nom)}"><input class="in" type="tel" data-k="tel" placeholder="Teléfono / WhatsApp" value="${esc(V.tel)}">` : ''}
    ${sel('estado', [['Pagado', 'Pagado'], ['Por Cobrar', 'Por Cobrar']], V.estado)}
    ${cred ? sel('dias', [[8, 'Vence en 8 días'], [15, 'Vence en 15 días'], [30, 'Vence en 30 días']], V.dias) : ''}
    ${sel('metodo', [['Efectivo', 'Efectivo'], ['Tarjeta', 'Tarjeta'], ['Transferencia', 'Transferencia']], V.metodo)}
<label class="flex gap-2 items-center"><input type="checkbox" data-k="itbis" data-r ${V.itbis ? 'checked' : ''}> Aplicar ITBIS (${D.cfg.itbis}%)</label>
    <label class="block text-sm font-semibold">Al terminar, imprimir en:${sel('imp', [['ticket', 'Ticket 58 mm (impresora de bolsillo)'], ['carta', 'Factura tamaño carta (impresora grande)']], fmt())}</label>
<div class="flex justify-between font-bold text-lg"><span>Total</span><span>${R(t.total)}</span></div>
<button class="btn" data-a="vender">Registrar Venta</button></div>`;
}
function vInv() {
  const f = form;
  return `<button class="btn" data-a="nuevoP">+ Agregar Producto</button>`
    + (f ? `<div class="card space-y-3"><h2 class="font-bold">${f.id ? 'Editar' : 'Nuevo'} producto</h2>
      ${fld('f-n', 'Nombre', f.nombre)}${fld('f-c', 'Categoría', f.cat)}${fld('f-co', 'Costo de compra (RD$)', f.costo, 'number')}${fld('f-pr', 'Precio de venta (RD$)', f.precio, 'number')}${f.id ? '' : fld('f-s', 'Stock inicial', f.stock, 'number')}${fld('f-m', 'Stock mínimo', f.min, 'number')}
<div class="flex gap-2"><button class="btn" data-a="saveP">Guardar</button><button class="btn2" data-a="cancel">Cancelar</button></div></div>` : '')

  put(m.fecha, M, 15, false); line(15); y += 4;
  rule();

  m.lineas.forEach(([k, v]) => {
    wrap(k + ': ' + v, F(16), W).forEach(l => { put(l, M, 16, false); line(16); });
  });
  y += 4; rule();
  (m.items || []).forEach(i => {
    wrap(i.nombre, F(17, true), W).forEach(l => { put(l, M, 17, true); line(17); });
    put(i.cant + ' x ' + f2(i.precio), M, 15, false); put(f2(i.cant * i.precio), PXW - M, 17, true, 'right'); line(17); y += 4;
  });

    const ult = idx === m.tots.length - 1, fs = ult ? 22 : 16;

  });
  y += 4; rule();
  (m.pie || []).forEach(l => {

  ops.forEach(o => {

async function nubePull() {

async function respaldo(compartir) {

  const descargar = () => {
    const f = new File([txt], nombre, {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };

    for (const tipo of ['application/json', 'text/plain']) {

      if (!navigator.canShare({files: [f]})) continue;
      try { await navigator.share({files: [f], title: 'Respaldo ' + D.cfg.nombre}); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  descargar();

function restaurar(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.productos || !d.cfg) throw 0;
      if (!confirm('Esto reemplaza los datos actuales. ¿Continuar?')) return;
      D = Object.assign(seed(), d); D.cfg = Object.assign(seed().cfg, D.cfg); unirClientes(); save(); render(); toast('Respaldo restaurado');
    } catch (e) { toast('Archivo de respaldo no válido'); }
  };
  r.readAsText(file);
}

$('#au-up').addEventListener('click', async () => {

sb.auth.onAuthStateChange((event, session) => {

    return;
